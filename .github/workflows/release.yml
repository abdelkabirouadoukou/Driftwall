name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # Intel (macOS 12 Monterey target) build.
            args: '--target x86_64-apple-darwin'
          - platform: macos-latest
            # Apple Silicon build.
            args: '--target aarch64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter driftwall-app test

      # Signs the updater artifact (latest.json + .sig) with the keypair from
      # `tauri signer generate` so the in-app updater can trust it. Without
      # these two secrets set on the repo, the build still produces a normal
      # .dmg but updates silently stay unsigned-and-unavailable.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: 'Driftwall v__VERSION__'
          releaseBody: 'Gatekeeper will flag an unsigned app as an "unidentified developer" — right-click → Open, or run `xattr -dr com.apple.quarantine /Applications/Driftwall.app`. Already running an earlier version? Settings → About → Check for updates.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
