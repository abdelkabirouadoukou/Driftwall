<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- YouTube refuses to play (error 153) when it cannot tell who embeds it.
         This page is served from http://localhost, so it always can. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Driftwall player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        transition: background-color 400ms ease;
      }
      #player,
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script src="/player.js"></script>
  </body>
</html>
