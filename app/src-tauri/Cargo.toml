[package]
name = "driftwall"
version = "0.1.0"
description = "Driftwall — Your desktop, alive."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

# Optimise dependencies even in dev builds (keeps streaming/parsing fast while
# our own crate still compiles unoptimised). The first build after this change
# is slower; subsequent ones are not.
[profile.dev.package."*"]
opt-level = 2

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
